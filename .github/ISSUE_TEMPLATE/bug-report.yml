name: Bug report
about: Report a visual, functional, or token-related issue in UI Foundations
title: ''
body:
  - type: input
    id: summary
    attributes:
      label: Summary
      description: A short, descriptive summary of the problem.
      placeholder: "e.g. Button focus outline missing in dark mode"
    validations:
      required: true

  - type: textarea
    id: purpose
    attributes:
      label: Problem (What is happening)
      description: Describe the problem or bug in one paragraph.
      placeholder: "A clear and concise description of the bug."
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: Describe what should happen.
      placeholder: "What did you expect to happen?"
    validations:
      required: false

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual behavior
      description: Describe what actually happened.
      placeholder: "What happened instead?"
    validations:
      required: false

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Reproduction steps
      description: Steps to reproduce the issue (clear, numbered).
      placeholder: |
        1. Go to '...'
        2. Click '...'
        3. Observe '...'
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment (optional)
      description: OS, browser, package version, brand, color mode (if applicable).
      placeholder: "e.g. macOS 14, Chrome 125, package 0.5.0"
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: Impact (optional)
      description: How critical is this issue? Any customer or release impact?
      placeholder: "e.g. blocker, high, medium, cosmetic"
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Describe observable completion, including outcome and evidence.
      placeholder: |
        Outcome:
        Evidence:
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation notes
      description: How to validate the fix and what evidence is required.
      placeholder: |
        Checks:
        Evidence:
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add logs, Figma link, CI output, or other details.
      placeholder: "Optional. Add links or context."
    validations:
      required: false
